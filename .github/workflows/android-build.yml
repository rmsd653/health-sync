name: Build Debug APK

on:
  push:
    branches: [ "**" ] # Triggers on pushes to any branch
  pull_request:
    branches: [ "main", "master" ] # Also triggers on PRs to main/master
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          # Wildcard handles standard builds as well as product flavors
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Generate Job Summary with Download Link
        run: |
          echo "### 🎉 Debug APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Click here to download the APK (ZIP)](${{ steps.upload-apk.outputs.artifact-url }})**" >> $GITHUB_STEP_SUMMARY